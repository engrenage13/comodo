<main [attr.aria-busy]="busy()" class="m-column m-center m-left extra-gap">
  <h1 #heading class="local-title">Comodo</h1>

  <div class="m-row m-gap-l button-list">
    @if (hasStoredModel()) {
      <button
        class="m-ghost-button extended-button m-column m-grow infobulle-support"
        (click)="resume()"
        [disabled]="busy()"
      >
        <span class="material-symbols-rounded icon" aria-hidden="true">history</span>
        <span>Reprendre</span>
        <div class="infobulle m-card">
          <span class="m-heading-l inline">{{storedTitle()}}</span>
          <span class="m-description m-row m-gap-xs inline">
          {{`${tablesCount()} table` | accord:tablesCount()}}
            enregistrées dans ce navigateur
        </span>
        </div>
      </button>
    }

    <button
      class="m-ghost-button extended-button m-column m-grow"
      (click)="requestNewModel()"
      [disabled]="busy()"
      [attr.aria-expanded]="confirmNew()"
      [attr.aria-controls]="confirmNew() ? 'confirm-new' : null"
    >
      <span class="material-symbols-rounded icon" aria-hidden="true">note_add</span>
      <span>Nouveau modèle</span>
    </button>

    <button
      class="m-ghost-button extended-button m-column m-grow"
      (click)="openFromComputer()"
      [disabled]="busy()"
      title="Cherchez un fichier JSON sur votre appareil"
    >
      <span class="material-symbols-rounded icon" aria-hidden="true">folder_open</span>
      <span>Ouvrir un fichier</span>
    </button>
  </div>

  @if (confirmNew()) {
    <app-confirm-popup (confirm)="$event ? createNewModel() : cancelNew()">
      <p>Le modèle « {{ storedTitle() }} » enregistré dans ce navigateur sera remplacé.</p>
    </app-confirm-popup>
  }

  @if (error()) {
    <p class="form-error" role="alert">{{ error() }}</p>
  }

  <output class="visually-hidden">{{ busy() ? 'Ouverture du modèle.' : '' }}</output>

  <input
    #fileInput
    type="file"
    accept=".json,application/json"
    hidden
    tabindex="-1"
    (change)="onFileSelected($event)"
  />
</main>
