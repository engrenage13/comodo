<f-flow fDraggable [fDraggableDisabled]="!isSelector()">
  <f-selection-area />
  <f-canvas fZoom #Canvas>
    <!--<f-connection 
      fSourceId="source-1" 
      fTargetId="target-1" 
      fBehavior="floating" 
      fType="adaptive-curve"
    ></f-connection>
    <f-connection fSourceId="source-1" fTargetId="target-2"></f-connection>-->

    <ng-container ngProjectAs="[fNodes]">
      @for(table of tables(); track $index) {
        <app-table [content]="table" [id]="$index" [disableDragging]="!isSelector()" />
      }
    </ng-container>
  </f-canvas>

  <div>
    <f-minimap [fMinSize]="2000" />
  </div>
</f-flow>

@if (!isSelector()) {
  <div class="invisible-full" (click)="createTable()"></div>
}

<app-toolbar />

@if(isSidePanelOpen()) {
  <app-side-panel
    title="Modifier la table"
    (closePanel)="isSidePanelOpen.set(false)"
  >
    
  </app-side-panel>
}
