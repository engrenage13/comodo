<f-flow
  fDraggable
  [fDraggableDisabled]="!isSelector()"
  (fCreateConnection)="createConnection($event)"
  (fReassignConnection)="reassignConnection($event)"
  (fFullRendered)="onLoaded()"
>
  <f-auto-pan [fEdgeThreshold]="20" [fSpeed]="8" [fAcceleration]="true" />
  <f-magnetic-lines [threshold]="40" />
  <f-selection-area />
  <f-canvas fZoom>
    <f-connection-for-create fType="segment" />
    <f-snap-connection [fSnapThreshold]="50" fType="segment" />

    @for (connection of connections(); track connection.id) {
      <f-connection
        fType="segment"
        [fSourceId]="connection.source"
        [fTargetId]="connection.target"
        [fReassignableStart]="true"
      >
        <div fConnectionContent connection-toolbar [connectionData]="connection"></div>
      </f-connection>
    }

    <ng-container ngProjectAs="[fNodes]">
      @for(table of tables(); track table.id) {
        <app-table
          [content]="table"
          [id]="table.id"
          [disableOptions]="!isSelector()"
          (edit)="editedTable.set(table)"
        />
      }
    </ng-container>
  </f-canvas>

  <div>
    <f-minimap [fMinSize]="2000" />
  </div>
</f-flow>

@if (!isSelector()) {
  <div
    class="invisible-full"
    (click)="createTable()"
    (keydown.enter)="createTable()"
    (keydown.space)="createTable()"
  ></div>
}

<app-toolbar />

@if(editedTable()) {
  <app-table-settings [tableDatas]="editedTable()!" (closePanel)="editedTable.set(undefined)" />
}
