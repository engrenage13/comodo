<app-popup
  windowTitle="Modifier la table"
  (windowClosed)="closeWindow.emit()"
  [closeDemand]="closed()"
  minWidth="80vw"
>
  <!-- General settings -->
  <section class="m-row m-between m-gap-s">
    <div class="m-row m-gap-s">
      <label for="title">Nom de la table</label>
      <input id="title" class="m-input" type="text" [formField]="tableForm.title" />
      @if (tableForm.title().invalid()) {
        <p class="form-error">{{tableForm.title().errors()[0].message}}</p>
      }
    </div>
  </section>
</app-popup>
