<div class="toolbar-foundation row gap-s">
  <app-project-menu />

  <form class="model-title" (submit)="saveTitle($event)">
    <label for="model-title" class="visually-hidden">Titre du modèle</label>
    <input
      id="model-title"
      class="model-title-input"
      type="text"
      autocomplete="off"
      [formField]="titleForm.title"
      [attr.aria-invalid]="titleInvalid() ? true : null"
      [attr.aria-describedby]="titleInvalid() ? 'model-title-error' : null"
      (blur)="saveTitle()"
    />
    @if (titleInvalid()) {
      <ul id="model-title-error" class="column error-list model-title-error">
        @for (error of titleForm.title().errors(); track error.kind) {
          <li class="form-error">{{error.message}}</li>
        }
      </ul>
    }
  </form>

  <nav class="toolbar row">
    <button
      #selectionButton
      (click)="setCursorMode(0)"
      class="icobutton"
      [class.selected]="cursorMode() == 0"
      title="Sélection"
    >
      <span class="material-symbols-rounded">arrow_selector_tool</span>
    </button>
    <button
      (click)="setCursorMode(1)"
      class="icobutton"
      [class.selected]="cursorMode() == 1"
      title="Ajouter une table"
    >
      <span class="material-symbols-rounded">table</span>
    </button>
  </nav>
</div>
