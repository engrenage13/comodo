@if (checkBoxMode()) {
  <!-- Check box -->
  <button class="row gap-xs column-checkable" (click)="check()" [class.checked]="checked()">
    <div class="checked-area row center">
      @if (checked()) {
        <span class="material-symbols-rounded icon">check</span>
      }
    </div>

    <p class="no-margin">{{columnDatas().name}}</p>
  </button>
} @else {
  <!-- Column form -->
  <div class="column gap-xs" cdkDrag>
    <form class="row column-row gap-xs" onsubmit="return false">
      <!-- Drag indicator -->
      <span class="material-symbols-rounded drag-handle" cdkDragHandle>drag_indicator</span>

      <div class="column gap-xs grow">
        <div class="row gap-xxs grow">
          <div class="column gap-xxs grow">
            <label for="name">Nom</label>
            <input id="name" type="text" class="input row grow" [formField]="columnForm.name" />
          </div>
          <div class="column gap-xxs">
            <label for="type">Type</label>
            <select id="type" class="input row" [formField]="columnForm.type">
              <option [value]="EDataType.String">String</option>
              <option [value]="EDataType.Number">Number</option>
              <option [value]="EDataType.Date">Date</option>
              <option [value]="EDataType.Time">Time</option>
              <option [value]="EDataType.DateTime">DateTime</option>
            </select>
          </div>
          <div class="column gap-xxs field-xxs">
            <label for="maxLength">Longueur max</label>
            <input id="maxLength" type="number" class="input row" [formField]="columnForm.maxlength" />
          </div>
        </div>

        <div class="row gap-xs">
          <button
            class="chips"
            [class.selected]="columnDatas().isPrimaryKey"
            (click)="declareAsPrimaryKey()"
          >
            Clé primaire
          </button>
          <button
            class="chips"
            [class.selected]="columnDatas().isUnique"
            (click)="columnDatas().isUnique = !columnDatas().isUnique"
            [disabled]="columnDatas().isPrimaryKey"
          >
            Unique
          </button>
          <button
            class="chips"
            [class.selected]="columnDatas().isNotNull"
            (click)="columnDatas().isNotNull = !columnDatas().isNotNull"
            [disabled]="columnDatas().isPrimaryKey"
          >
            Non null
          </button>
        </div>
      </div>
    </form>

    @if (columnForm().touched() && columnForm().invalid()) {
      <ul class="column error-list">
        @for (error of columnForm.name().errors(); track $index) {
          <li class="form-error">{{error.message}}</li>
        }
      </ul>
    }
  </div>
}
