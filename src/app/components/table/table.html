<div
  fNode
  fDragHandle
  [fNodeId]="id()"
  [fNodePosition]="content().coords"
  [fNodeDraggingDisabled]="disableOptions()"
  [fAutoSizeToFitChildren]="true"
  (fNodePositionChange)="updateCoords($event)"
  [attr.aria-label]="content().title"
  class="m-column"
>
  <div class="m-column table-content">
    <div class="m-row m-between m-gap-s title-row">
      <p class="table-title">{{content().title}}</p>

      <div class="m-row m-right options-row">
        <button
          class="m-ghost-button m-ico-button ico-button"
          title="Modifier la table"
          (click)="edit.emit()"
          [disabled]="disableOptions()"
        >
          <span class="material-symbols-rounded">settings</span>
        </button>
      </div>
    </div>

    <table class="column-table">
      <thead>
        <th></th>
        <th></th>
        <th></th>
        <th></th>
        <th></th>
        <th></th>
      </thead>
      <tbody>
        @for (column of content().columns; track $index) {
          <tr [title]="column.isPrimaryKey ? 'Clé primaire' : ''">
            <td fConnector [fConnectorId]="`t${id()}-${column.name}@1`" class="connector-left"></td>
            <td [class.empty]="!column.isPrimaryKey">
              @if (column.isPrimaryKey) {
                <span class="material-symbols-rounded small">vpn_key</span>
              }
            </td>
            <td [class.underline]="column.isUnique">{{column.name}}</td>
            <td>
              {{column.type}}
              @if (column.type == 'string' && column.maxlength) {
                ({{column.maxlength}})
              }
            </td>
            <td class="m-description" [class.empty]="!column.isNotNull">
              {{column.isNotNull ? 'non null' : ''}}
            </td>
            <td fConnector [fConnectorId]="`t${id()}-${column.name}@2`" class="connector-right"></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
