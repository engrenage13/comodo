<div
  fNode
  [fNodeId]="id()"
  [fNodePosition]="content().coords"
  [fNodeDraggingDisabled]="disableOptions()"
>
  <nav class="row right options-row">
    <button 
    class="ico-button classic" 
    title="Modifier la table" 
    (click)="edit.emit()" 
    [disabled]="disableOptions()"
    >
      <span class="material-symbols-rounded">table_edit</span>
    </button>
    <button class="ico-button" fDragHandle title="Déplacer la table" [disabled]="disableOptions()">
      <span class="material-symbols-rounded">drag_pan</span>
    </button>
  </nav>
  <div class="table-title">{{content().title}}</div>

  <table>
    <tbody>
      @for (column of content().columns; track $index) {
        <tr>
          <td>{{column.name}}</td>
          <td>{{column.type}}</td>
        </tr>
      }
    </tbody>
  </table>
  <!--<div
    fConnector
    fConnectorId="source-1"
    fConnectorType="source"
    fConnectorConnectableSide="right"
  ></div>-->
</div>
