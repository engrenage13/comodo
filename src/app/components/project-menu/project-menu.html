<div class="project" #projectRoot>
  <button
    #projectButton
    type="button"
    class="m-button m-ico-button"
    title="Projet"
    aria-label="Projet"
    aria-haspopup="menu"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-controls]="menuOpen() && !confirmNew() ? 'project-menu' : null"
    [disabled]="busy()"
    (click)="toggleMenu()"
  >
    <span class="material-symbols-rounded rotate-anchor" aria-hidden="true" [class.rotate]="menuOpen()">
      {{menuOpen() ? 'add' : 'menu'}}
    </span>
  </button>

  @if (menuOpen()) {
    <div
      id="project-menu"
      class="menu m-column m-gap-xs"
      role="menu"
      (keydown)="onMenuKeydown($event)"
    >
      <button
        #menuItem
        type="button"
        class="m-ghost-button m-left"
        role="menuitem"
        (click)="requestNew()"
        [disabled]="busy()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">note_add</span>
        Nouveau projet
      </button>

      <button
        #menuItem
        type="button"
        class="m-ghost-button m-left"
        role="menuitem"
        (click)="isFilePopupOpened.set(true)"
        [disabled]="busy()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">folder_open</span>
        Ouvrir un projet
      </button>

      <hr class="m-separator" />

      <button
        #menuItem
        type="button"
        class="m-ghost-button m-left"
        role="menuitem"
        (click)="saveAs()"
        [disabled]="busy()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">download</span>
        Télécharger
      </button>
    </div>

    @if (isFilePopupOpened()) {
      <app-file-import-popup (confirm)="closeFilePopup($event)" />
    }

    @if (confirmNew()) {
      <app-confirm-popup (confirm)="confirmNewModel($event)">
        <p>Le modèle « {{ title() }} » enregistré dans ce navigateur sera remplacé.</p>
      </app-confirm-popup>
    }
  }
  <output class="visually-hidden">{{ busy() ? 'Ouverture du modèle.' : '' }}</output>
</div>
