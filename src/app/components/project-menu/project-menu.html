<button
  ngMenuTrigger
  #origin
  #trigger="ngMenuTrigger"
  [menu]="baseMenu()"
  type="button"
  class="m-button m-ico-button"
  title="Projet"
  aria-label="Projet"
  [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="expanded() && !confirmNew() ? 'project-menu' : null"
  [disabled]="busy()"
>
    <span class="material-symbols-rounded rotate-anchor" aria-hidden="true" [class.rotate]="expanded()">
      {{expanded() ? 'add' : 'menu'}}
    </span>
</button>

<ng-template
  [cdkConnectedOverlay]="{origin, usePopover: 'inline'}"
  [cdkConnectedOverlayOpen]="trigger.expanded()"
  [cdkConnectedOverlayPositions]="[
    {originX: 'start', originY: 'bottom', overlayX: 'start', overlayY: 'top', offsetY: 4},
  ]"
  cdkAttachPopoverAsChild
>
  <div ngMenu #baseMenu="ngMenu">
    <ng-template ngMenuContent>
      <div class="m-column m-gap-xs">
        @for (section of options; track $index; let first = $first) {
          @for (item of section; track item.code) {
            @if (!first) {
              <hr class="m-separator" aria-orientation="horizontal" />
            }

            <div
              ngMenuItem
              [value]="item.code"
              class="m-ghost-button m-left"
              (click)="startAction(item.code)"
              (keydown.enter)="startAction(item.code)"
            >
              <span class="material-symbols-rounded" translate="no" aria-hidden="true">{{item.icon}}</span>
              <span>{{item.label}}</span>
            </div>
          }
        }
      </div>
    </ng-template>
  </div>
</ng-template>

@if (isFilePopupOpened()) {
  <app-file-import-popup (confirm)="closeFilePopup($event)" />
}

@if (confirmNew()) {
  <app-confirm-popup (confirm)="confirmNewModel($event)">
    <p>Le modèle « {{ title() }} » enregistré dans ce navigateur sera remplacé.</p>
  </app-confirm-popup>
}
