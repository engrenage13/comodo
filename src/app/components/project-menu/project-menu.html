<div class="project" #projectRoot>
  <button
    #projectButton
    type="button"
    [class]="(menuOpen() ? 'm-button' : 'm-ghost-button') + ' m-ico-button'"
    title="Projet"
    aria-label="Projet"
    aria-haspopup="menu"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-controls]="menuOpen() && !confirmNew() ? 'project-menu' : null"
    [disabled]="busy()"
    (click)="toggleMenu()"
  >
    <span class="material-symbols-rounded" aria-hidden="true">menu</span>
  </button>

  @if (menuOpen()) {
    <div
      id="project-menu"
      class="menu m-column m-gap-xs"
      role="menu"
      (keydown)="onMenuKeydown($event)"
    >
      <button
        #menuItem
        type="button"
        class="m-ghost-button m-left"
        role="menuitem"
        (click)="requestNew()"
        [disabled]="busy()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">note_add</span>
        Nouveau projet
      </button>

      <button
        #menuItem
        type="button"
        class="m-ghost-button m-left"
        role="menuitem"
        (click)="openProject()"
        [disabled]="busy()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">folder_open</span>
        Ouvrir un projet
      </button>

      <hr class="m-separator" />

      <button
        #menuItem
        type="button"
        class="m-ghost-button m-left"
        role="menuitem"
        (click)="saveAs()"
        [disabled]="busy()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">download</span>
        Télécharger
      </button>
    </div>

    @if (confirmNew()) {
      <app-confirm-popup (confirm)="confirmNewModel($event)">
        <p>Le modèle « {{ title() }} » enregistré dans ce navigateur sera remplacé.</p>
      </app-confirm-popup>
    }
  }

  @if (!menuOpen()) {
    @if (error()) {
      <p class="message form-error" role="alert">{{ error() }}</p>
    } @else if (busy()) {
      <output class="visually-hidden">Ouverture du modèle.</output>
    }
  }

  <input
    #fileInput
    type="file"
    accept=".json,application/json"
    hidden
    tabindex="-1"
    (change)="onFileSelected($event)"
  />
</div>
